name: Pages

# Fetches price data and publishes the site to the gh-pages branch (GitHub Pages).
# Runs when the page or pipeline changes (or by hand). The 5-minute refresh during
# market hours is done by live.yml.
# Login: the data files are encrypted for the users in the SITE_USERS secret
# (one "user:password" per line); see pipeline/encrypt_data.py.

on:
  push:
    paths:
      - "mockup/**"
      - "pipeline/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      parts:
        description: "Delar att hämta (intra,hour,daily)"
        default: "intra,hour,daily"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Choose data parts
        id: parts
        run: echo "parts=${{ github.event.inputs.parts || 'intra,hour,daily' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -t .

      # Plain data lives only in the Actions cache (not public); the site gets encrypted copies.
      - name: Restore data from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch, encrypt and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_USERS: ${{ secrets.SITE_USERS }}
        run: bash pipeline/publish.sh "${{ steps.parts.outputs.parts }}"

      - name: Save data for later runs
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
