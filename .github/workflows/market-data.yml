name: Market data

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/market-data.yml"
  # Every 30 min on weekdays, 07:00–20:30 UTC (09:00–22:30 Swedish summer time).
  # Scheduled runs only happen for the workflow file on the default branch.
  schedule:
    - cron: "*/30 7-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python pipeline/fetch_market_data.py --out data/market.json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update market data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
